# =====================================================================
# Configuracion de SOC Forense
# ---------------------------------------------------------------------
# Cada valor se puede sobreescribir con una variable de entorno del mismo
# nombre en MAYUSCULAS y con los puntos cambiados por guiones bajos.
# Ejemplo: db.password -> DB_PASSWORD
# (Este archivo va sin tildes para que se lea igual en cualquier editor.)
# =====================================================================

# --- Base de datos MySQL ---------------------------------------------
# El esquema soc_forense y sus tablas se crean solos al arrancar.
# Solo hace falta que MySQL este iniciado y que el usuario y la clave
# coincidan con los de su conexion en MySQL Workbench.
db.url=jdbc:mysql://localhost:3306/soc_forense?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
db.user=root
db.password=root
# Driver JDBC. Vacio = se deduce de la URL (MySQL si empieza por jdbc:mysql).
db.driver=

# --- Evidencias --------------------------------------------------------
# Carpeta donde se guardan los logs subidos. Vacio = carpeta del usuario:
#   Windows: C:\\Users\\<usuario>\\soc-forense\\evidencias
#   Linux/macOS: ~/soc-forense/evidencias
evidence.dir=
upload.max.mb=25

# --- Agente de IA (API compatible con OpenAI) --------------------------
# Por defecto apunta a LM Studio en este mismo equipo. Si no hay modelo
# disponible, la aplicacion sigue funcionando con el motor de reglas.
# Para no intentar conectar nunca, ponga ai.enabled=false.
ai.enabled=true
ai.base.url=http://localhost:1234/v1
# LM Studio acepta cualquier nombre y usa el modelo cargado. Otros
# servidores (Ollama, vLLM) necesitan el nombre exacto del modelo.
ai.model=local-model
ai.api.key=lm-studio
# Segundos de espera por respuesta. Suba el valor si su equipo es lento.
ai.timeout.seconds=90
# Lineas maximas que se envian al modelo por evidencia. En logs mas
# grandes se eligen las lineas con senales de ataque; las reglas revisan
# siempre el archivo completo.
ai.max.lines=480

# --- Parametros de inferencia por tarea --------------------------------
# Controlan el comportamiento del modelo. Forma: ai.<perfil>.<parametro>
# Perfiles: analisis (lectura de logs en JSON), chat (agente), plan
# (plan de respuesta a incidentes).
#   temperature        0 a 2. Baja = determinista; alta = creativa.
#   top.p              0 a 1. Muestreo de nucleo (probabilidad acumulada).
#   top.k              Entero. Solo las k palabras mas probables. 0 = no se
#                      envia (use 0 con la API oficial de OpenAI).
#   max.tokens         Longitud maxima de la respuesta. 0 = sin limite.
#   frequency.penalty  -2 a 2. Castiga repetir las mismas palabras.
#   presence.penalty   -2 a 2. Castiga volver a temas ya mencionados.
# El analisis deja las penalizaciones en 0: el JSON repite claves a proposito.
ai.analisis.temperature=0.1
ai.analisis.top.p=0.9
ai.analisis.top.k=40
ai.analisis.max.tokens=3000
ai.analisis.frequency.penalty=0.0
ai.analisis.presence.penalty=0.0

ai.chat.temperature=0.3
ai.chat.top.p=0.9
ai.chat.top.k=40
ai.chat.max.tokens=1024
ai.chat.frequency.penalty=0.3
ai.chat.presence.penalty=0.2

ai.plan.temperature=0.4
ai.plan.top.p=0.95
ai.plan.top.k=50
ai.plan.max.tokens=1500
ai.plan.frequency.penalty=0.2
ai.plan.presence.penalty=0.1

# --- Ventana de contexto -------------------------------------------------
# Tokens maximos (entrada + salida) que el modelo procesa por peticion.
# Debe coincidir con el "Context Length" del modelo cargado en LM Studio.
# Si una peticion no cabe, se recorta el historial y luego el contexto.
ai.context.window=8192
ai.context.margin=256

# --- Datos y fundamentacion (RAG) ---------------------------------------
# Lineas del log mas relevantes para la pregunta que recibe el agente
# cuando el analista elige una evidencia.
ai.rag.lines=40

# --- Escalabilidad, recursos y costos ------------------------------------
# Consultas simultaneas al modelo (protege RAM/GPU) y espera maxima en cola.
ai.max.concurrent=2
ai.queue.wait.seconds=30
# Tarifa en USD por millon de tokens para estimar el costo (TCO).
# Modelo local = 0. Con un proveedor en la nube, ponga su tarifa.
ai.cost.input.per.million=0
ai.cost.output.per.million=0

# --- Usuarios iniciales ------------------------------------------------
# Se crean una sola vez, cuando la tabla users esta vacia.
# Cambie estas claves desde "Mi cuenta" despues del primer ingreso.
seed.admin.password=Admin1234
seed.analyst.password=Analista1234
